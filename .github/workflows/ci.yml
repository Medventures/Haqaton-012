name: Проверка проекта

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
        env:
          MEDHUB_ENV: test
          OPENAI_API_KEY: ''
      - run: git diff --check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Запуск сервера без внешнего API
        run: python -B server.py > /tmp/prime-server.log 2>&1 &
        env:
          MEDHUB_ENV: test
          MEDHUB_AGENT_ENABLED: 'false'
          OPENAI_API_KEY: ''
      - run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/healthz
      - name: Проверка интерфейса на синтетических данных
        run: python scripts/browser_smoke.py --base-url http://127.0.0.1:8000
      - name: Проверка панели клиники
        run: python scripts/metrics_smoke.py --base-url http://127.0.0.1:8000

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag prime-checkup:ci .
      - name: Запуск контейнера без внешнего API
        run: >-
          docker run --detach --name prime-ci
          --env MEDHUB_ENV=production
          --env MEDHUB_ALLOWED_ORIGINS=https://clinic.example
          --env MEDHUB_SIGNING_SECRET=ci-only-not-a-production-secret-123456789
          --publish 127.0.0.1:8000:8000
          prime-checkup:ci
      - name: Проверка готовности контейнера
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/readyz
      - if: always()
        run: docker stop prime-ci
