services:
  prime:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MEDHUB_ENV: production
      MEDHUB_HOST: 0.0.0.0
      MEDHUB_PORT: "8000"
      MEDHUB_METRICS_DB: /app/data/metrics.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - metrics:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  metrics:
